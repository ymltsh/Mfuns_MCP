[project]
name = "mfuns-mcp"
version = "0.1.0"
description = "Mfuns 喵御宅社区 MCP Server（stdio，Python MCP SDK）"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "oss2>=2.18",
]

[project.scripts]
mfuns-mcp = "mfuns_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfuns_mcp"]
